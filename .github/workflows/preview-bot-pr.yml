name: Preview bot-PR

# Cloudflare (Workers Builds) bouwt alleen branches die in deze repo staan. Een PR vanaf
# de fork van het bot-account krijgt daardoor geen preview. Deze workflow zet zo'n PR,
# samengevoegd met de laatste main, als preview/pr-<nummer> in deze repo. Cloudflare bouwt
# die branch, en de workflow zet het adres en de uitkomst in een reactie op de PR.
#
# Veiligheid:
#   - pull_request_target draait met schrijfrechten in deze repo. Daarom voert deze
#     workflow NOOIT code uit de PR uit (geen pnpm, geen node, geen scripts): alleen git.
#   - Automatisch alleen voor PR's van het bot-account (studio-harmony, zie de `if` van de
#     taak). Cloudflare bouwt die code zonder voorafgaande review, met het token van
#     Workers Builds: een bewuste keuze van de eigenaar (issue #12).
#   - Wijzigt een PR iets in .github/workflows, dan weigert GitHub de push van de
#     previewbranch en komt er geen preview.
#
# Met de hand starten kan ook (Actions > Preview bot-PR > Run workflow), voor elke open PR.

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, closed]
  workflow_dispatch:
    inputs:
      pr:
        description: Nummer van de open PR waarvoor de preview (opnieuw) gezet moet worden
        required: true
        type: number

permissions: {}

# Een nieuwe commit of het sluiten van de PR breekt een lopende run voor dezelfde PR af.
concurrency:
  group: preview-pr-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ github.token }}
  REPO: ${{ github.repository }}
  PR: ${{ github.event.pull_request.number || inputs.pr }}
  # Een preview-adres is <branch>-<worker>.<account>.workers.dev; in de branchnaam wordt / een -
  PREVIEW_HOST_SUFFIX: -mariellemadern.mmadern.workers.dev

jobs:
  preview:
    name: preview
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.action != 'closed' && github.event.pull_request.user.login == 'studio-harmony')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # de previewbranch pushen
      pull-requests: write # de reactie op de PR
      checks: read # de uitkomst van Workers Builds lezen
    steps:
      - name: Check that the PR is open
        run: |
          set -euo pipefail

          if ! [[ "$PR" =~ ^[0-9]+$ ]]; then
            echo "::error title=Ongeldig PR-nummer::'$PR' is geen nummer."
            exit 1
          fi

          state=$(gh api "repos/$REPO/pulls/$PR" --jq .state)
          if [ "$state" != "open" ]; then
            echo "::error title=PR is niet open::PR #$PR heeft de status '$state'."
            exit 1
          fi

      # De standaardbranch van deze repo, niet de code van de PR.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      # Alleen git: de bestanden van de PR komen wel in de werkmap, maar er wordt niets
      # uit uitgevoerd.
      - name: Merge the PR into the default branch
        id: merge
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch --quiet origin "refs/pull/$PR/head"
          {
            echo "head_sha=$(git rev-parse FETCH_HEAD)"
            echo "base_sha=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

          if ! git merge --no-ff --no-edit \
            -m "Preview: PR #$PR samengevoegd met $DEFAULT_BRANCH" FETCH_HEAD; then
            git merge --abort || true
            echo "outcome=conflict" >> "$GITHUB_OUTPUT"
            echo "::error title=Conflict met $DEFAULT_BRANCH::PR #$PR is niet zonder conflicten samen te voegen met $DEFAULT_BRANCH."
            exit 1
          fi

          echo "merge_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Push the preview branch
        id: push
        run: |
          set -euo pipefail

          branch="preview/pr-$PR"
          # Lukt het bijwerken niet, dan de oude previewbranch weghalen en opnieuw aanmaken.
          if ! git push --force origin "HEAD:refs/heads/$branch"; then
            git push origin --delete "$branch" || true
            git push origin "HEAD:refs/heads/$branch"
          fi

          echo "url=https://preview-pr-${PR}${PREVIEW_HOST_SUFFIX}" >> "$GITHUB_OUTPUT"

      # Cloudflare meldt de bouw als check "Workers Builds" op de samenvoeg-commit.
      - name: Wait for the Cloudflare build
        id: build
        env:
          MERGE_SHA: ${{ steps.merge.outputs.merge_sha }}
        run: |
          set -euo pipefail

          outcome="niet-gestart"
          for attempt in $(seq 1 40); do
            run=$(gh api "repos/$REPO/commits/$MERGE_SHA/check-runs?per_page=100" \
              --jq '[.check_runs[] | select(.app.slug == "cloudflare-workers-and-pages")] | first | "\(.status // "") \(.conclusion // "")"')
            case "$run" in
              "completed success") outcome="geslaagd" && break ;;
              "completed "*) outcome="mislukt" && break ;;
              " ") outcome="niet-gestart" ;;
              *) outcome="loopt-nog" ;;
            esac
            sleep 10
          done

          echo "outcome=$outcome" >> "$GITHUB_OUTPUT"
          echo "Bouw bij Cloudflare: $outcome"
          [ "$outcome" = "geslaagd" ]

      # Eén reactie per PR, die bij elke nieuwe commit wordt bijgewerkt.
      - name: Comment on the PR
        if: ${{ !cancelled() }}
        env:
          HEAD_SHA: ${{ steps.merge.outputs.head_sha }}
          BASE_SHA: ${{ steps.merge.outputs.base_sha }}
          MERGE_SHA: ${{ steps.merge.outputs.merge_sha }}
          MERGE_OUTCOME: ${{ steps.merge.outputs.outcome }}
          PUSH_STEP: ${{ steps.push.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outputs.outcome }}
          URL: ${{ steps.push.outputs.url }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          if [ -z "$HEAD_SHA" ]; then
            echo "De PR is niet opgehaald: geen reactie."
            exit 0
          fi

          marker="<!-- preview-bot-pr -->"
          stand="commit \`${HEAD_SHA:0:7}\` van deze PR, samengevoegd met \`$DEFAULT_BRANCH\` (\`${BASE_SHA:0:7}\`)"

          if [ "$MERGE_OUTCOME" = "conflict" ]; then
            tekst="**Geen preview:** commit \`${HEAD_SHA:0:7}\` is niet zonder conflicten samen te voegen met \`$DEFAULT_BRANCH\`. Werk de branch bij op de laatste \`$DEFAULT_BRANCH\`."
          elif [ "$PUSH_STEP" != "success" ]; then
            tekst="**Geen preview:** de previewbranch kon niet worden gezet voor commit \`${HEAD_SHA:0:7}\`. Wijzigt deze PR iets in \`.github/workflows\`? Dan kan er geen automatische preview komen. Zie de [run]($RUN_URL)."
          else
            case "$BUILD_OUTCOME" in
              geslaagd) bouw="geslaagd" ;;
              mislukt) bouw="**mislukt**. Het log staat in Cloudflare; dat kan alleen de eigenaar inzien. Controleer of \`pnpm build\` slaagt" ;;
              loopt-nog) bouw="loopt nog; het adres werkt zodra de check \`Workers Builds\` op de [commit](https://github.com/$REPO/commit/$MERGE_SHA) groen is" ;;
              *) bouw="**niet gestart** binnen zeven minuten. Start deze workflow opnieuw of meld het de eigenaar" ;;
            esac
            tekst=$(printf '%s\n' \
              "**Adres:** $URL" \
              "**Stand:** $stand" \
              "**Bouw bij Cloudflare:** $bouw." \
              "" \
              "Het adres is publiek, blijft uit zoekmachines en wordt bij elke nieuwe commit bijgewerkt. De branch \`preview/pr-$PR\` verdwijnt zodra de PR sluit.")
          fi

          body=$(printf '%s\n### Preview\n\n%s\n' "$marker" "$tekst")

          id=$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- preview-bot-pr -->"))) | .id' | tail -n 1)

          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$id" -f body="$body" > /dev/null
            echo "Reactie $id bijgewerkt."
          else
            gh api --method POST "repos/$REPO/issues/$PR/comments" -f body="$body" > /dev/null
            echo "Reactie geplaatst."
          fi

  opruimen:
    name: opruimen
    if: github.event_name == 'pull_request_target' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # de previewbranch weggooien
    steps:
      - name: Delete the preview branch
        run: |
          set -euo pipefail

          ref="heads/preview/pr-$PR"
          if gh api "repos/$REPO/git/ref/$ref" > /dev/null 2>&1; then
            gh api --method DELETE "repos/$REPO/git/refs/$ref"
            echo "Branch preview/pr-$PR verwijderd."
          else
            echo "Geen branch preview/pr-$PR: niets te doen."
          fi
